resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"frontend-service","mode":"public"}';
    }

    location = /info {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"service":"frontend-service","version":"4.1.0","runtime":"React static bundle / Nginx","container_port":80,"persistence":"Stateless","networks":["edge-net","service-net"],"responsibility":"Serve the public web UI and expose ngrok tunnel metadata only; browser calls Order and Catalog through their own public URLs"}';
    }

    # Same-origin runtime discovery for the three public URLs managed by one ngrok agent.
    # This exposes inspector metadata only; it does not proxy business APIs.
    location = /runtime/tunnels {
        set $ngrok_inspector "http://ngrok:4040/api/tunnels";
        proxy_pass $ngrok_inspector;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
