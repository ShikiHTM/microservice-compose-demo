resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    set $order_upstream http://order-service:8003;
    set $catalog_upstream http://catalog-service:8002;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"frontend-nginx","mode":"private"}';
    }

    location = /info {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"service":"frontend-nginx","version":"4.1.0","runtime":"React static bundle + Nginx reverse proxy","container_port":80,"persistence":"Stateless","networks":["edge-net","service-net"],"responsibility":"Serve the frontend and reverse proxy only selected /shop routes to private microservices"}';
    }

    location = /shop/products {
        proxy_pass $catalog_upstream/products;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /shop/orders {
        proxy_pass $order_upstream/orders;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /shop/checkout {
        proxy_pass $order_upstream/orders;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /shop/system/order/info {
        proxy_pass $order_upstream/info;
        proxy_http_version 1.1;
    }

    location = /shop/system/order/dependencies {
        proxy_pass $order_upstream/dependencies;
        proxy_http_version 1.1;
    }

    location = /shop/system/order/stats {
        proxy_pass $order_upstream/stats;
        proxy_http_version 1.1;
    }

    location = /shop/system/catalog/info {
        proxy_pass $catalog_upstream/info;
        proxy_http_version 1.1;
    }

    location = /shop/system/catalog/dependencies {
        proxy_pass $catalog_upstream/dependencies;
        proxy_http_version 1.1;
    }

    location = /shop/system/catalog/stats {
        proxy_pass $catalog_upstream/stats;
        proxy_http_version 1.1;
    }

    location = /api {
        default_type application/json;
        return 404 '{"detail":"Raw backend API paths are not exposed in Case 1. Only selected /shop routes are reverse proxied."}';
    }

    location ^~ /api/ {
        default_type application/json;
        return 404 '{"detail":"Raw backend API paths are not exposed in Case 1. Only selected /shop routes are reverse proxied."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
